# Deploiement du wiki Drakkenheim sur GitHub Pages.
#
# Ce workflow ne fait que *construire* le site a partir du dossier `content/`
# deja commite, puis le publier. Le contenu vient de la sync locale :
#   Obsidian Vault\Drakkenheim\  ->  content/     (script drakkenheim-publish.ps1)
# La sync a besoin du vault Obsidian (et de PowerShell), elle reste donc locale.
# Pour mettre le site a jour : relancer le script, commiter, pousser.
#
# Prerequis cote depot GitHub, a faire UNE fois a la main :
#   Settings > Pages > "Build and deployment" > Source = "GitHub Actions".
#
# Cette etape ne peut pas etre faite par le workflow : l'option
# `enablement: true` de configure-pages exige un jeton autre que le
# GITHUB_TOKEN fourni par Actions (un PAT avec le scope `repo`, ou une
# GitHub App avec `administration:write` et `pages:write`). Avec le jeton par
# defaut, l'API repond "Resource not accessible by integration".
#
# Attention aussi : GitHub Pages n'est disponible pour un depot PRIVE que sur
# une offre payante (Pro/Team/Enterprise). Sur l'offre gratuite, le depot doit
# etre public (Settings > General > Danger Zone > Change visibility).
#
# Le URL publique depend du nom du depot : https://<compte>.github.io/<depot>/
# et doit correspondre a `baseUrl` dans quartz.config.yaml
# (actuellement : lazureetienne.github.io/drakkenheim-wiki).

name: Deploy Drakkenheim Wiki

on:
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Version epinglee volontairement : le label `ubuntu-latest` migre vers
    # Ubuntu 26 a partir du 19/10/2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # Pas d'option `enablement` ici : voir l'en-tete du fichier.
      # Cette etape lit la configuration Pages du depot (et sort base_path,
      # origin, etc. utiles pour verifier que baseUrl est coherent).
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
